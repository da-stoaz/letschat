<!doctype html><html><head><meta charset="utf-8"><title>Chat history regression</title></head><body><div id="root"></div><script>
const memory = new Map();
Object.defineProperty(window, 'localStorage', { value: { getItem: key => memory.get(key) ?? null, setItem: (key, value) => memory.set(key, String(value)), removeItem: key => memory.delete(key) } });
</script><script type="module" src="./chat-history.tsx"></script></body></html>
