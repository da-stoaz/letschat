# Only CI/test data: fresh project, random loopback ports, no host data mounts.
# Keep images aligned with dev/prod via version-check.yml.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: backend-tests
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 60

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 60

  spacetimedb:
    image: clockworklabs/spacetime:v2.10.1
    command: start
    ports:
      - "127.0.0.1::3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/v1/ping"]
      interval: 2s
      timeout: 2s
      retries: 60
