name: Backend compatibility

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./server -> target
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: bun run test:unit
      - run: dotnet test core-api/CoreApi.slnx --filter 'FullyQualifiedName~DiscoveryTests|FullyQualifiedName~ChatRevocationTests'
      - name: Build disposable candidate backend
        run: |
          cargo build --manifest-path server/Cargo.toml --target wasm32-unknown-unknown --release --locked
          docker build -f server/Dockerfile.module -t letschat-compat-module:candidate server
          docker build -f core-api/Dockerfile -t letschat-compat-core:candidate core-api
      - name: Real client/backend compatibility matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tests/compatibility/matrix.py
