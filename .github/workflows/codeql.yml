name: CodeQL

# Runs once per change, after it lands on main, and never on pull requests: a
# PR would pay for the same analysis twice and wait ~10 minutes on Rust. Each
# push analyzes only the languages whose files it changed; the weekly run
# re-analyzes everything so every language stays current.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  languages:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - uses: actions/checkout@v6
      - id: pick
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Scheduled and manual runs, or a push whose base can't be fetched,
          # analyze everything.
          changed=ALL
          if [ "$GITHUB_EVENT_NAME" = push ] && git fetch --quiet --depth=1 origin "$BEFORE"; then
            changed=$(git diff --name-only "$BEFORE" HEAD) || changed=ALL
          fi
          pick() {
            if [ "$changed" = ALL ] || grep -qE "$2" <<<"$changed"; then echo "$1"; fi
          }
          {
            pick actions '^\.github/(workflows|actions)/'
            pick csharp '\.(cs|csproj|cshtml|razor|slnx?|props|targets)$'
            pick javascript-typescript '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|html)$'
            pick python '\.py$'
            pick rust '\.rs$|(^|/)Cargo\.(toml|lock)$'
          } | jq -Rnc '[inputs]' | sed 's/^/languages=/' | tee -a "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.languages) }}
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
