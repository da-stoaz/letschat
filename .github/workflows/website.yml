name: Website

# Site-only PRs skip Backend compatibility, whose repo-wide `eslint .` used to
# be the only lint covering site/. This keeps that coverage for the website.
on:
  pull_request:
    paths:
      - 'site/**'
      - 'eslint.config.js'
      - '.github/workflows/website.yml'

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      # ESLint and Vitest live in the root package.
      - run: bun install --frozen-lockfile
      - run: bunx eslint site
      # Before the site tests: site/tsconfig.json extends Astro's.
      - run: npm ci
        working-directory: site
      - run: bunx vitest run --config site/vitest.config.ts
      - run: npm run build
        working-directory: site
      # The security backports, then the built download page.
      - run: node --test tests/*.test.mjs
        working-directory: site
