name: Dependency security

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/package*.json'
      - 'site/vendor/**'
      - 'site/tests/**'
      - 'src-tauri/Cargo.*'
      - 'src-tauri/vendor/**'
      - 'src-tauri/security-tests/**'
      - 'scripts/check_dependency_backports.py'
      - '.github/workflows/dependency-security.yml'

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm audit --audit-level=low
        working-directory: site
      - run: npm run test:security
        working-directory: site
      - run: npm run build
        working-directory: site

  glib-backport:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/security-tests -> target
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - run: python3 scripts/check_dependency_backports.py
      - run: cargo test --manifest-path src-tauri/security-tests/Cargo.toml --locked --release
