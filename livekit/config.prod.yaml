port: 44380
rtc:
  # Set to your home server's public IP, or leave blank to let LiveKit
  # auto-detect it on startup (use_external_ip: true).
  use_external_ip: true
  use_ice_lite: false
  use_mdns: false                   # disable mDNS in production
  enable_loopback_candidate: false
  allow_tcp_fallback: true
  tcp_port: 44381
  udp_port: 44382
# No `keys:` here: docker-compose.prod.base.yml passes LIVEKIT_KEYS, built from
# LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env — the same values core-api signs
# voice tokens with. LIVEKIT_KEYS replaces any `keys:` block in this file.
log_level: info
# Speaking indicator. The SFU decides who is speaking (even for your own mic)
# per update_interval-ms window: a window counts if >= min_percentile% of it is
# louder than -active_level dBov, then the level is EMA-smoothed over
# smooth_intervals windows. Defaults (400 ms, 35, 40%, 2) lagged ~0.5 s and
# dropped quiet speech between syllables.
audio:
  update_interval: 100
  active_level: 45      # -45 dBov; was -35, quiet speech fell below it
  min_percentile: 20    # syllable gaps no longer zero a whole window
  smooth_intervals: 3   # longer release so the ring holds across pauses
