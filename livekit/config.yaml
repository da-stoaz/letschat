port: 7880
rtc:
  use_external_ip: false
  # Dev runs LiveKit inside Docker, so a full ICE agent tries to run connectivity
  # checks outward from the container: it advertises its container IP (unreachable
  # from the host) and public srflx candidates, and cannot resolve the browser's
  # mDNS .local candidates across the bridge. Media then never establishes and the
  # client times out with a dtls timeout. ICE-lite makes LiveKit accept connections
  # on its advertised candidates instead of probing outward, which is the right
  # model for a server at a fixed, reachable address.
  use_ice_lite: true
  use_mdns: false
  enable_loopback_candidate: true
  allow_tcp_fallback: true
  udp_port: 7882
  tcp_port: 7881
keys:
  devkey: devsecret0123456789devsecret0123456789
log_level: info
