services:
  # ── Caddy reverse-proxy track ───────────────────────────────────────────────
  # Expose 80/443 publicly to this host. Caddy terminates TLS and proxies to
  # internal services on the Docker network.
  caddy:
    image: caddy:2
    container_name: letschat-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_SCHEME: "${PUBLIC_SCHEME:-https}"
      AUTH_DOMAIN: "${AUTH_DOMAIN:?Set AUTH_DOMAIN}"
      CHAT_DOMAIN: "${CHAT_DOMAIN:?Set CHAT_DOMAIN}"
      FILES_DOMAIN: "${FILES_DOMAIN:?Set FILES_DOMAIN}"
      LIVEKIT_DOMAIN: "${LIVEKIT_DOMAIN:?Set LIVEKIT_DOMAIN}"
      # Compose's native conditional expansion omits the optional browser site.
      CADDY_WEB_SITE: "${APP_DOMAIN:+import hosted-web ${PUBLIC_SCHEME:-https}://${APP_DOMAIN}}"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - core-api
      - spacetimedb
      - minio
      - livekit
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
