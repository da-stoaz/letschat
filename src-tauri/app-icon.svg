<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 824px tile on a 1024px canvas: the macOS Dock footprint, including 100px transparent margins. -->
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="#fafafa" filter="url(#shadow)" />
  <image x="160" y="160" width="704" height="704" href="data:image/png;base64," />
</svg>
